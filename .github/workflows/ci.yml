name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: lila
          POSTGRES_PASSWORD: lila
          POSTGRES_DB: lila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lila"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lila:lila@localhost:5432/lila
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pip install pytest pytest-asyncio ruff mypy
      - run: ruff check src
      - run: mypy src
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
